# Render Blueprint: one web service that runs the API and serves the built frontend
# from the same origin (no CORS setup, first-party session cookie).
# Deploy: Render Dashboard → New → Blueprint → pick this repository. See README → Deployment.
services:
  - type: web
    runtime: node
    name: careerflow
    plan: free
    region: singapore
    buildCommand: npm run build:deploy
    startCommand: npm start
    # Reports 200 only while MongoDB is connected, so a deploy that can't reach the
    # database never receives traffic.
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      # Render's proxy sits in front of the app: needed for correct client IPs
      # (rate limiting) and HTTPS detection.
      - key: TRUST_PROXY
        value: "1"
      # Secrets. MONGODB_URI is asked for once when the Blueprint is created (paste the
      # Atlas connection string); JWT_SECRET is generated by Render (256 random bits).
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
